<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" style="background-color: #FAFAFA; font-family: 'Consolas', 'Courier New', monospace;">
    <defs>
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#1B2A47" flood-opacity="0.15"/>
        </filter>
    </defs>

    <!-- ==========================================
         TITLE & SUBTITLE
         ========================================== -->
    <text x="480" y="65" font-size="22" font-weight="bold" fill="#1B2A47" text-anchor="middle" letter-spacing="1">iTantra — NLLB Translation Latency: Cold Load vs Warm Inference</text>
    <text x="480" y="95" font-size="14" fill="#1B2A47" text-anchor="middle">Cold requests include on-demand model loading; warm request executes with the model resident.</text>

    <!-- ==========================================
         Y-AXIS TITLE & GRID
         ========================================== -->
    <!-- Rotated Y-Axis Label -->
    <text x="60" y="350" font-size="14" font-weight="bold" fill="#1B2A47" text-anchor="middle" transform="rotate(-90 60,350)">End-to-End Translation Latency (seconds)</text>

    <!-- Scale: 0 to 15s. Height = 300px. Y_bottom = 500. 1s = 20px. -->
    
    <!-- 15 s -->
    <line x1="120" y1="200" x2="840" y2="200" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="105" y="205" font-size="12" fill="#1B2A47" text-anchor="end">15</text>
    
    <!-- 12 s -->
    <line x1="120" y1="260" x2="840" y2="260" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="105" y="265" font-size="12" fill="#1B2A47" text-anchor="end">12</text>
    
    <!-- 9 s -->
    <line x1="120" y1="320" x2="840" y2="320" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="105" y="325" font-size="12" fill="#1B2A47" text-anchor="end">9</text>
    
    <!-- 6 s -->
    <line x1="120" y1="380" x2="840" y2="380" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="105" y="385" font-size="12" fill="#1B2A47" text-anchor="end">6</text>
    
    <!-- 3 s -->
    <line x1="120" y1="440" x2="840" y2="440" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="105" y="445" font-size="12" fill="#1B2A47" text-anchor="end">3</text>
    
    <!-- 0 s (Baseline) -->
    <line x1="120" y1="500" x2="840" y2="500" stroke="#1B2A47" stroke-width="2"/>
    <text x="105" y="505" font-size="12" font-weight="bold" fill="#1B2A47" text-anchor="end">0</text>


    <!-- ==========================================
         DATA BARS
         ========================================== -->

    <!-- REQUEST #1 (Cold Initial - 14.00s -> Height: 280px) -->
    <rect x="170" y="220" width="140" height="280" fill="#FDE68A" stroke="#1B2A47" stroke-width="2" rx="4" filter="url(#shadow)"/>
    
    <text x="240" y="205" font-size="18" font-weight="bold" fill="#1B2A47" text-anchor="middle">14.00 s</text>
    
    <text x="240" y="250" font-size="16" font-weight="bold" fill="#1B2A47" text-anchor="middle" letter-spacing="1">COLD</text>
    <text x="240" y="270" font-size="14" fill="#1B2A47" text-anchor="middle">Initial</text>


    <!-- REQUEST #2 (Warm Resident - 0.12s -> Height: ~3px visually, Y=497) -->
    <rect x="410" y="497" width="140" height="3" fill="#A7F3D0" stroke="#1B2A47" stroke-width="1" filter="url(#shadow)"/>
    
    <text x="480" y="435" font-size="18" font-weight="bold" fill="#1B2A47" text-anchor="middle">0.12 s</text>
    
    <text x="480" y="460" font-size="16" font-weight="bold" fill="#1B2A47" text-anchor="middle" letter-spacing="1">WARM</text>
    <text x="480" y="480" font-size="14" fill="#1B2A47" text-anchor="middle">Resident</text>


    <!-- REQUEST #3 (Cold Reload - 9.00s -> Height: 180px, Y=320) -->
    <rect x="650" y="320" width="140" height="180" fill="#DDD6FE" stroke="#1B2A47" stroke-width="2" rx="4" filter="url(#shadow)"/>
    
    <text x="720" y="305" font-size="18" font-weight="bold" fill="#1B2A47" text-anchor="middle">9.00 s</text>
    
    <text x="720" y="350" font-size="16" font-weight="bold" fill="#1B2A47" text-anchor="middle" letter-spacing="1">COLD</text>
    <text x="720" y="370" font-size="14" fill="#1B2A47" text-anchor="middle">Reload</text>


    <!-- ==========================================
         X-AXIS LABELS
         ========================================== -->
    
    <!-- Request 1 -->
    <text x="240" y="540" font-size="16" font-weight="bold" fill="#1B2A47" text-anchor="middle">Request #1</text>
    <text x="240" y="565" font-size="14" fill="#1B2A47" text-anchor="middle">Hindi → Marathi</text>
    <text x="240" y="585" font-size="14" fill="#1B2A47" text-anchor="middle">Initial Cold Load</text>

    <!-- Request 2 -->
    <text x="480" y="540" font-size="16" font-weight="bold" fill="#1B2A47" text-anchor="middle">Request #2</text>
    <text x="480" y="565" font-size="14" fill="#1B2A47" text-anchor="middle">Hindi → Marathi</text>
    <text x="480" y="585" font-size="14" fill="#1B2A47" text-anchor="middle">Warm / Resident</text>

    <!-- Request 3 -->
    <text x="720" y="540" font-size="16" font-weight="bold" fill="#1B2A47" text-anchor="middle">Request #3</text>
    <text x="720" y="565" font-size="14" fill="#1B2A47" text-anchor="middle">Hindi → Marathi</text>
    <text x="720" y="585" font-size="14" fill="#1B2A47" text-anchor="middle">Cold Reload</text>

</svg>
