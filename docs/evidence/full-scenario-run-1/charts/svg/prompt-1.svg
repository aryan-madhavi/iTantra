<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background-color: #FAFAFA; font-family: 'Consolas', 'Courier New', monospace;">
    <defs>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#1B2A47" flood-opacity="0.10"/>
        </filter>
        <filter id="light-shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#1B2A47" flood-opacity="0.05"/>
        </filter>
    </defs>

    <!-- ==========================================
         HEADER
         ========================================== -->
    <text x="60" y="55" font-size="26" font-weight="bold" fill="#1B2A47" letter-spacing="0.5">iTantra — On-Device AI Memory &amp; Model Lifecycle</text>
    <text x="60" y="80" font-size="16" fill="#475569">Dual-Device BLE Mesh • Dynamic Model Loading • Idle Memory Reclamation</text>

    <!-- ==========================================
         LEFT COLUMN: MEMORY FOOTPRINT (X:60 -> X:860)
         ========================================== -->
    
    <!-- Legend -->
    <rect x="60" y="115" width="220" height="36" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#light-shadow)"/>
    <line x1="75" y1="125" x2="95" y2="125" stroke="#1E3A8A" stroke-width="2.5"/>
    <text x="105" y="129" font-size="12" font-weight="bold" fill="#1B2A47">Receiver Process PSS</text>
    <line x1="75" y1="140" x2="95" y2="140" stroke="#64748B" stroke-width="2" stroke-dasharray="4 2"/>
    <text x="105" y="144" font-size="12" fill="#475569">Sender Process PSS</text>

    <!-- Y-Axis Title -->
    <text x="35" y="270" font-size="14" font-weight="bold" fill="#1B2A47" text-anchor="middle" transform="rotate(-90 35,270)">Memory Footprint (MB)</text>

    <!-- Chart Area Background -->
    <rect x="80" y="170" width="770" height="250" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Y-Axis Grid & Labels (0 to 2500 MB) -->
    <!-- Scale: Y=420 is 0MB, Y=170 is 2500MB (1MB = 0.1px) -->
    
    <line x1="80" y1="170" x2="850" y2="170" stroke="#F1F5F9" stroke-width="1"/>
    <text x="70" y="174" font-size="12" fill="#64748B" text-anchor="end">2500</text>
    
    <line x1="80" y1="220" x2="850" y2="220" stroke="#F1F5F9" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="70" y="224" font-size="12" fill="#64748B" text-anchor="end">2000</text>
    
    <line x1="80" y1="270" x2="850" y2="270" stroke="#F1F5F9" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="70" y="274" font-size="12" fill="#64748B" text-anchor="end">1500</text>
    
    <line x1="80" y1="320" x2="850" y2="320" stroke="#F1F5F9" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="70" y="324" font-size="12" fill="#64748B" text-anchor="end">1000</text>
    
    <line x1="80" y1="370" x2="850" y2="370" stroke="#F1F5F9" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="70" y="374" font-size="12" fill="#64748B" text-anchor="end">500</text>
    
    <line x1="80" y1="420" x2="850" y2="420" stroke="#1B2A47" stroke-width="2"/>
    <text x="70" y="424" font-size="12" font-weight="bold" fill="#1B2A47" text-anchor="end">0</text>

    <!-- X-Axis Labels (0 to 550s. Scale: 1.4px per second) -->
    <text x="80" y="440" font-size="12" fill="#1B2A47" text-anchor="middle">0</text>
    <line x1="80" y1="420" x2="80" y2="425" stroke="#1B2A47" stroke-width="2"/>

    <text x="220" y="440" font-size="12" fill="#1B2A47" text-anchor="middle">100</text>
    <line x1="220" y1="420" x2="220" y2="425" stroke="#1B2A47" stroke-width="2"/>

    <text x="360" y="440" font-size="12" fill="#1B2A47" text-anchor="middle">200</text>
    <line x1="360" y1="420" x2="360" y2="425" stroke="#1B2A47" stroke-width="2"/>

    <text x="500" y="440" font-size="12" fill="#1B2A47" text-anchor="middle">300</text>
    <line x1="500" y1="420" x2="500" y2="425" stroke="#1B2A47" stroke-width="2"/>

    <text x="640" y="440" font-size="12" fill="#1B2A47" text-anchor="middle">400</text>
    <line x1="640" y1="420" x2="640" y2="425" stroke="#1B2A47" stroke-width="2"/>

    <text x="780" y="440" font-size="12" fill="#1B2A47" text-anchor="middle">500</text>
    <line x1="780" y1="420" x2="780" y2="425" stroke="#1B2A47" stroke-width="2"/>
    
    <text x="465" y="465" font-size="14" font-weight="bold" fill="#1B2A47" text-anchor="middle">Elapsed Time (seconds)</text>

    <!-- Data Plot: Receiver PSS -->
    <!-- Points scaled: X = 80 + (T*1.4), Y = 420 - (MB*0.1) -->
    <path d="M 80,420 L 105.6,390.9 L 174.2,380.5 L 246.6,370.8 L 255.0,266.4 L 263.4,196.1 L 332.0,192.0 L 416.0,191.5 L 423.0,393.7 L 480.4,392.4 L 483.2,369.9 L 487.4,293.4 L 495.8,193.8 L 575.6,190.4 L 578.4,364.9 L 651.2,382.5 L 746.4,400.9 L 791.2,401.7 L 841.6,401.9" 
          fill="none" stroke="#1E3A8A" stroke-width="3" stroke-linejoin="round"/>

    <!-- Data Plot: Sender PSS -->
    <path d="M 80,420 L 92.6,387.2 L 172.4,381.3 L 175.2,348.4 L 245.2,353.0 L 304.0,352.4 L 311.0,385.3 L 326.4,347.8 L 392.2,353.1 L 395.0,385.2 L 476.2,375.0 L 479.0,352.9 L 648.4,352.3 L 689.0,356.2 L 712.8,359.3 L 721.2,390.5 L 753.4,386.2 L 789.8,389.9 L 841.6,390.6" 
          fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="5 3" stroke-linejoin="round"/>


    <!-- ==========================================
         LIFECYCLE STRIP (X:80 -> X:850)
         ========================================== -->
    <text x="80" y="505" font-size="14" font-weight="bold" fill="#1B2A47">MODEL LIFECYCLE &amp; APP STATE</text>
    
    <rect x="80" y="515" width="770" height="130" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Track Backgrounds & Grid Lines -->
    <line x1="80" y1="545" x2="850" y2="545" stroke="#F1F5F9" stroke-width="1"/>
    <line x1="80" y1="575" x2="850" y2="575" stroke="#F1F5F9" stroke-width="1"/>
    <line x1="80" y1="605" x2="850" y2="605" stroke="#F1F5F9" stroke-width="1"/>
    
    <text x="70" y="535" font-size="12" fill="#1B2A47" text-anchor="end">NLLB (Rx)</text>
    <text x="70" y="565" font-size="12" fill="#1B2A47" text-anchor="end">STT (Tx)</text>
    <text x="70" y="595" font-size="12" fill="#1B2A47" text-anchor="end">TTS (Rx)</text>
    <text x="70" y="625" font-size="12" fill="#1B2A47" text-anchor="end">APP UI</text>

    <!-- NLLB Track (Y=520, H=20) -->
    <!-- Load 1: 119-132 -->
    <rect x="246.6" y="520" width="18.2" height="20" rx="3" fill="#93C5FD" stroke="#1E3A8A" stroke-width="1"/>
    <!-- Resident 1: 132-240 -->
    <rect x="264.8" y="520" width="151.2" height="20" rx="3" fill="#BFDBFE" stroke="#1E3A8A" stroke-width="1"/>
    <text x="340.4" y="534" font-size="10" font-weight="bold" fill="#1E3A8A" text-anchor="middle">RESIDENT</text>
    
    <!-- Load 2: 287-295 -->
    <rect x="481.8" y="520" width="11.2" height="20" rx="3" fill="#93C5FD" stroke="#1E3A8A" stroke-width="1"/>
    <!-- Resident 2: 295-356 -->
    <rect x="493.0" y="520" width="85.4" height="20" rx="3" fill="#BFDBFE" stroke="#1E3A8A" stroke-width="1"/>
    <text x="535.7" y="534" font-size="10" font-weight="bold" fill="#1E3A8A" text-anchor="middle">RESIDENT</text>

    <!-- STT Track (Y=550, H=20) -->
    <!-- 65-164 -->
    <rect x="171.0" y="550" width="138.6" height="20" rx="3" fill="#A7F3D0" stroke="#065F46" stroke-width="1"/>
    <text x="240.3" y="564" font-size="10" font-weight="bold" fill="#065F46" text-anchor="middle">RESIDENT</text>
    <!-- 174-225 -->
    <rect x="323.6" y="550" width="71.4" height="20" rx="3" fill="#A7F3D0" stroke="#065F46" stroke-width="1"/>
    <!-- 282-453 -->
    <rect x="474.8" y="550" width="239.4" height="20" rx="3" fill="#A7F3D0" stroke="#065F46" stroke-width="1"/>
    <text x="594.5" y="564" font-size="10" font-weight="bold" fill="#065F46" text-anchor="middle">RESIDENT</text>

    <!-- TTS Track (Y=580, H=20) -->
    <!-- 4-6, 6-101 -->
    <rect x="85.6" y="580" width="2.8" height="20" rx="1" fill="#C4B5FD" stroke="#4C1D95" stroke-width="1"/>
    <rect x="88.4" y="580" width="133.0" height="20" rx="3" fill="#DDD6FE" stroke="#4C1D95" stroke-width="1"/>
    <text x="154.9" y="594" font-size="10" font-weight="bold" fill="#4C1D95" text-anchor="middle">RESIDENT</text>
    <!-- 102-104, 104-244 -->
    <rect x="222.8" y="580" width="2.8" height="20" rx="1" fill="#C4B5FD" stroke="#4C1D95" stroke-width="1"/>
    <rect x="225.6" y="580" width="196.0" height="20" rx="3" fill="#DDD6FE" stroke="#4C1D95" stroke-width="1"/>
    <text x="323.6" y="594" font-size="10" font-weight="bold" fill="#4C1D95" text-anchor="middle">RESIDENT</text>
    <!-- 296-299, 299-327 -->
    <rect x="494.4" y="580" width="4.2" height="20" rx="1" fill="#C4B5FD" stroke="#4C1D95" stroke-width="1"/>
    <rect x="498.6" y="580" width="39.2" height="20" rx="3" fill="#DDD6FE" stroke="#4C1D95" stroke-width="1"/>
    <!-- 327-330, 330-395 -->
    <rect x="537.8" y="580" width="4.2" height="20" rx="1" fill="#C4B5FD" stroke="#4C1D95" stroke-width="1"/>
    <rect x="542.0" y="580" width="91.0" height="20" rx="3" fill="#DDD6FE" stroke="#4C1D95" stroke-width="1"/>
    <!-- 395-397, 397-408 -->
    <rect x="633.0" y="580" width="2.8" height="20" rx="1" fill="#C4B5FD" stroke="#4C1D95" stroke-width="1"/>
    <rect x="635.8" y="580" width="15.4" height="20" rx="3" fill="#DDD6FE" stroke="#4C1D95" stroke-width="1"/>
    <!-- 408-411, 411-476 -->
    <rect x="651.2" y="580" width="4.2" height="20" rx="1" fill="#C4B5FD" stroke="#4C1D95" stroke-width="1"/>
    <rect x="655.4" y="580" width="91.0" height="20" rx="3" fill="#DDD6FE" stroke="#4C1D95" stroke-width="1"/>

    <!-- APP/UI Track (Y=610, H=20) -->
    <!-- 3-436 FG -->
    <rect x="84.2" y="610" width="606.2" height="20" rx="3" fill="#FDE68A" stroke="#92400E" stroke-width="1"/>
    <text x="387.3" y="624" font-size="10" font-weight="bold" fill="#92400E" text-anchor="middle">FOREGROUND</text>
    <!-- 436-481 BKG -->
    <rect x="690.4" y="610" width="63.0" height="20" rx="3" fill="#E2E8F0" stroke="#475569" stroke-width="1"/>
    <text x="721.9" y="624" font-size="10" font-weight="bold" fill="#475569" text-anchor="middle">BKG</text>
    <!-- 481-508 FG -->
    <rect x="753.4" y="610" width="37.8" height="20" rx="3" fill="#FDE68A" stroke="#92400E" stroke-width="1"/>
    <text x="772.3" y="624" font-size="10" font-weight="bold" fill="#92400E" text-anchor="middle">FG</text>
    <!-- 508-544 UI CLOSED -->
    <rect x="791.2" y="610" width="50.4" height="20" rx="3" fill="#CBD5E1" stroke="#334155" stroke-width="1"/>
    <text x="816.4" y="624" font-size="10" font-weight="bold" fill="#334155" text-anchor="middle">CLOSED</text>


    <!-- Vertical Reference Markers (Connect Graph to Lifecycle) -->
    <!-- T=119 NLLB Load -->
    <line x1="246.6" y1="170" x2="246.6" y2="520" stroke="#1E3A8A" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
    <rect x="238.6" y="152" width="16" height="16" rx="8" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2"/>
    <text x="246.6" y="163" font-size="10" font-weight="bold" fill="#1E3A8A" text-anchor="middle">1</text>
    
    <!-- T=240 NLLB Dispose -->
    <line x1="416.0" y1="170" x2="416.0" y2="520" stroke="#1E3A8A" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
    <rect x="408.0" y="152" width="16" height="16" rx="8" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2"/>
    <text x="416.0" y="163" font-size="10" font-weight="bold" fill="#1E3A8A" text-anchor="middle">2</text>

    <!-- T=287 NLLB Load 2 -->
    <line x1="481.8" y1="170" x2="481.8" y2="520" stroke="#1E3A8A" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
    <rect x="473.8" y="152" width="16" height="16" rx="8" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2"/>
    <text x="481.8" y="163" font-size="10" font-weight="bold" fill="#1E3A8A" text-anchor="middle">3</text>

    <!-- T=508 UI Closed -->
    <line x1="791.2" y1="170" x2="791.2" y2="610" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
    <rect x="783.2" y="152" width="16" height="16" rx="8" fill="#FFFFFF" stroke="#334155" stroke-width="2"/>
    <text x="791.2" y="163" font-size="10" font-weight="bold" fill="#334155" text-anchor="middle">4</text>


    <!-- ==========================================
         RIGHT COLUMN: PANELS (X:900 -> X:1220)
         ========================================== -->
         
    <!-- Device Identity Panel -->
    <rect x="900" y="115" width="320" height="45" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" filter="url(#shadow)"/>
    <text x="915" y="133" font-size="12" font-weight="bold" fill="#1B2A47">SENDER:</text>
    <text x="975" y="133" font-size="12" fill="#475569">SM-G781B</text>
    <text x="915" y="149" font-size="12" font-weight="bold" fill="#1B2A47">RECEIVER:</text>
    <text x="985" y="149" font-size="12" fill="#475569">GM1911</text>

    <!-- Latency Benchmarks Panel -->
    <rect x="900" y="180" width="320" height="180" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#shadow)"/>
    <text x="915" y="205" font-size="14" font-weight="bold" fill="#1B2A47">NLLB Translation Latency</text>
    <line x1="915" y1="215" x2="1205" y2="215" stroke="#F1F5F9" stroke-width="1"/>

    <!-- Req 1: 14s (Max Width: 200px) -->
    <text x="915" y="240" font-size="12" fill="#1B2A47">Req #1 (Cold Initial)</text>
    <rect x="915" y="246" width="200" height="14" rx="2" fill="#FDE68A" stroke="#92400E" stroke-width="1"/>
    <text x="1125" y="258" font-size="12" font-weight="bold" fill="#1B2A47">14.00 s</text>

    <!-- Req 2: 0.12s -->
    <text x="915" y="285" font-size="12" fill="#1B2A47">Req #2 (Warm / Resident)</text>
    <rect x="915" y="291" width="4" height="14" rx="1" fill="#A7F3D0" stroke="#065F46" stroke-width="1"/>
    <text x="930" y="303" font-size="12" font-weight="bold" fill="#1B2A47">0.12 s</text>

    <!-- Req 3: 9s (Width: 128px) -->
    <text x="915" y="330" font-size="12" fill="#1B2A47">Req #3 (Cold Reload)</text>
    <rect x="915" y="336" width="128" height="14" rx="2" fill="#FDE68A" stroke="#92400E" stroke-width="1"/>
    <text x="1053" y="348" font-size="12" font-weight="bold" fill="#1B2A47">9.00 s</text>

    <!-- Key Observations Panel -->
    <rect x="900" y="380" width="320" height="265" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#shadow)"/>
    <text x="915" y="405" font-size="14" font-weight="bold" fill="#1B2A47">Key Logged Observations</text>
    <line x1="915" y1="415" x2="1205" y2="415" stroke="#F1F5F9" stroke-width="1"/>

    <!-- Bullet 1 -->
    <circle cx="925" cy="438" r="3" fill="#1E3A8A"/>
    <text x="940" y="442" font-size="12" fill="#1B2A47">NLLB loads strictly on demand.</text>

    <!-- Bullet 2 -->
    <circle cx="925" cy="468" r="3" fill="#1E3A8A"/>
    <text x="940" y="472" font-size="12" fill="#1B2A47">Model remains resident between</text>
    <text x="940" y="488" font-size="12" fill="#1B2A47">translation requests.</text>

    <!-- Bullet 3 -->
    <circle cx="925" cy="518" r="3" fill="#1E3A8A"/>
    <text x="940" y="522" font-size="12" fill="#1B2A47">NLLB is disposed after logged</text>
    <text x="940" y="538" font-size="12" fill="#1B2A47">idle timeouts.</text>

    <!-- Bullet 4 -->
    <circle cx="925" cy="568" r="3" fill="#1E3A8A"/>
    <text x="940" y="572" font-size="12" fill="#1B2A47">Warm translation executes</text>
    <text x="940" y="588" font-size="12" fill="#1B2A47">substantially faster than cold.</text>

    <!-- Bullet 5 -->
    <circle cx="925" cy="618" r="3" fill="#1E3A8A"/>
    <text x="940" y="622" font-size="12" fill="#1B2A47">Receiver maintains service</text>
    <text x="940" y="638" font-size="12" fill="#1B2A47">telemetry after UI closure.</text>


    <!-- ==========================================
         MARKER LEGEND (Bottom Left)
         ========================================== -->
    <text x="80" y="685" font-size="12" font-weight="bold" fill="#1B2A47">Event Key:</text>
    <rect x="160" y="675" width="12" height="12" rx="6" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="1.5"/>
    <text x="166" y="684.5" font-size="8" font-weight="bold" fill="#1E3A8A" text-anchor="middle">1</text>
    <text x="178" y="685" font-size="11" fill="#475569">t=119s (Cold Load 1)</text>

    <rect x="310" y="675" width="12" height="12" rx="6" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="1.5"/>
    <text x="316" y="684.5" font-size="8" font-weight="bold" fill="#1E3A8A" text-anchor="middle">2</text>
    <text x="328" y="685" font-size="11" fill="#475569">t=240s (Idle Dispose)</text>

    <rect x="460" y="675" width="12" height="12" rx="6" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="1.5"/>
    <text x="466" y="684.5" font-size="8" font-weight="bold" fill="#1E3A8A" text-anchor="middle">3</text>
    <text x="478" y="685" font-size="11" fill="#475569">t=287s (Cold Load 2)</text>

    <rect x="610" y="675" width="12" height="12" rx="6" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/>
    <text x="616" y="684.5" font-size="8" font-weight="bold" fill="#334155" text-anchor="middle">4</text>
    <text x="628" y="685" font-size="11" fill="#475569">t=508s (UI Closed)</text>

</svg>
